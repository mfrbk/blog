######## Stellar info ########
stellar:
  version: '1.27.0'
  homepage: 'https://xaoxuu.com/wiki/stellar/'
  repo: 'https://github.com/xaoxuu/hexo-theme-stellar'
  main_css: /css/main.css
  main_js: /js/main.js


######## head tags ########
preconnect:
  # - https://gcore.jsdelivr.net
  # - https://unpkg.com

open_graph:
  enable: true


######## Sidebar ########
logo:
  avatar: '[{config.avatar}](/about/)'
  title: '[{config.title}](/)'
  subtitle: '云原生 | 编程 | 随想'

menubar:
  columns: 4
  items:
    - id: blog
      theme: '#1BCDFC'
      icon: solar:documents-bold-duotone
      title: 博客
      url: /
    - id: archives
      theme: '#FA6400'
      icon: solar:archive-bold-duotone
      title: 归档
      url: /archives/
    - id: categories
      theme: '#3DC550'
      icon: solar:sort-by-time-bold-duotone
      title: 分类
      url: /categories/
    - id: about
      theme: '#F44336'
      icon: solar:user-id-bold-duotone
      title: 关于
      url: /about/


######## Main ########
site_tree:
  # -- 列表类页面 -- #
  home:
    leftbar: welcome, recent
    rightbar:
  index_blog:
    base_dir: blog
    menu_id: blog
    leftbar: welcome, recent
    rightbar:
  index_topic:
    base_dir: topic
    menu_id: blog
  index_wiki:
    base_dir: wiki
    menu_id: blog

  # -- 内容类页面 -- #
  post:
    menu_id: blog
    leftbar: related, recent
    rightbar: toc
  topic:
    menu_id: blog
  wiki:
    menu_id: blog
    leftbar: tree, related, recent
    rightbar: toc
  page:
    leftbar: recent
    rightbar: toc
  error_page:
    menu_id: blog
    '404': '/404.html'
    leftbar: recent
    rightbar:


######## Article ########
article:
  type: tech
  auto_cover: false
  cover_ratio: 2.4
  auto_banner: false
  auto_excerpt: 256
  license: '本文采用 [署名-非商业性使用-相同方式共享 4.0 国际](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。'
  share: [wechat, link]
  related_posts:
    enable: false
    max_count: 5


######## Search ########
search:
  service: local_search
  local_search:
    field: all
    path: /search.json
    content: true
    codeblock: true


######## Comments ########
# 评论系统，根据需要启用
comments:
  service:
  comment_title: 快来参与讨论吧~


######## Widgets ########
widgets:
  welcome:
    layout: markdown
    title: 欢迎 👋
    content: |
      这里是 **mfrbk** 的个人博客，记录云原生、编程与技术思考。
  recent:
    layout: recent
    title: 近期文章
    limit: 5
  toc:
    layout: toc
    title: 目录
  related:
    layout: related
    title: 相关文章
    limit: 5
  tagcloud:
    layout: tagcloud
    title: 标签
    limit: 20


######## Footer ########
footer:
  social:
    github:
      icon: '<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" width="24" height="24"/>'
      url: https://github.com/mfrbk
  sitemap:
    '博客':
      - '[近期](/)'
      - '[归档](/archives/)'
    '其他':
      - '[关于](/about/)'
  content: |
    本站由 [{author.name}](/) 使用 [{theme.name} {theme.version}]({theme.tree}) 主题创建。
    本博客所有文章除特别声明外，均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。


######## Tag Plugins ########
tag_plugins:
  note:
    default_color: ''
    border: true
  checkbox:
    interactive: false
  quot:
    default:
      prefix: https://bu.dusays.com/2022/10/24/63567d3e092ff.png
      suffix: https://bu.dusays.com/2022/10/24/63567d3e0ab55.png
  emoji:
    default: https://gcore.jsdelivr.net/gh/cdn-x/emoji/qq/{name}.gif
  button:
    default_color: theme
  image:
    fancybox: false
  mark:
    default_color: yellow
  gallery:
    layout: grid
    ratio: square


######## Plugins ########
plugins:
  preload:
    enable: true
    service: flying_pages
  lazyload:
    enable: false
  fancybox:
    enable: true
  swiper:
    enable: true
  scrollreveal:
    enable: true
  copycode:
    enable: true
  katex:
    enable: false


######## Style ########
style:
  prefers_theme: auto
  smooth_scroll: false
  font-size:
    root: 16px
    body: 17px
    code: 85%
    codeblock: 0.8125rem
  border-radius:
    card-l: 16px
    card: 12px
    bar: 8px
    image: 12px


######## API Host ########
api_host:
  ghapi: api.github.com
  ghraw: raw.githubusercontent.com
  gist: gist.github.com
  ghcard: github-readme-stats.vercel.app


######## Default Placeholders ########
default:
  avatar: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
  link: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/link/8f277b4ee0ecd.svg
  cover: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/cover/76b86c0226ffd.svg
  image: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/image/2659360.svg
  banner: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/banner/books.jpg


######## System (don't change unless you know what you're doing) ########
system:
  override_pretty_urls: true
